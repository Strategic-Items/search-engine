[project]
name = "strategic-search-engine"
version = "0.1.0"
description = "OpenSearch search API and indexer for strategic-items services"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "opensearch-py>=2.8,<4",
  "pydantic-settings>=2.5,<3",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
search-index = "search_engine.indexer:main"
search-prepare = "search_engine.prepare:main"
search-evaluate = "search_engine.evaluate:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["search_engine*"]
