[project]
name = "strategic-search-engine"
version = "0.1.0"
description = "OpenSearch search API and indexer for strategic-items services"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain-text-splitters>=0.3,<1",
  "opensearch-py>=2.8,<4",
  "pydantic-settings>=2.5,<3",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
# 카테고리 검색의 SPLADE(38단계 파인튜닝 모델)를 돌릴 때만 필요하다.
sparse = ["torch>=2.4", "transformers>=4.44"]

[project.scripts]
search-index = "search_engine.indexing.indexer:main"
search-prepare = "search_engine.indexing.prepare:main"
search-evaluate = "search_engine.evaluation.evaluate:main"
search-compare = "search_engine.evaluation.compare:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["search_engine*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "uses_embedding_service: test drives the real OllamaEmbedder construction path",
]
