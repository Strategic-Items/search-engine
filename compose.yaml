# 로컬 개발 전용입니다. 프로덕션 환경은 보안이 강화된 OpenSearch 클러스터에 연결합니다.
services:
  opensearch:
    build: ./docker/opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9203:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  dashboards:
    image: opensearchproject/opensearch-dashboards:3.8.0
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "127.0.0.1:5603:5601"
    depends_on:
      opensearch:
        condition: service_healthy

# 문서의 자체 청크들을 쿼리와 대조하여 재정렬한다. 자세한 내용은
  # docs/evaluation/stages/applied/stage-19-chunk-rerank-within-document.md를 참조.
  # SEARCH_RERANK_CHUNKS=true가 설정될 때까지 아무 것도 사용하지 않는다.
  #
  # text-embeddings-inference는 동일한 /rerank 계약을 제공하며 amd64 또는 GPU 환경에서는 더 나은 선택이다.
  # `image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7`로 빌드를 교체하고
  # `command: --model-id ${SEARCH_RERANK_MODEL}`를 추가하면 된다.
  # arm64 빌드를 제공하지 않기 때문에 Apple silicon에서는 에뮬레이션으로 실행되며, 지연 시간은 모델의 실제 성능을 반영하지 않는다.
  #
  # 이 컨테이너의 지연 시간도 모델의 실제 성능을 반영하지 않는다. Docker Desktop은 이 컨테이너에 2개의 CPU와 GPU를 제공하지 않기 때문에,
  # 재정렬 기능을 켠 상태에서 검색의 p50 지연 시간은 17초에 이르며, 재정렬 기능을 끈 상태에서는 0.5초이다.
  # 동일한 모델과 동일한 가중치를 호스트의 MPS에서 실행하면 약 1.2초 정도 걸린다.
  # 이 두 수치 모두 배포 환경의 수치는 아니다: 하나는 2개의 코어에서 실행되는 크로스엔코더이고, 다른 하나는 이 컨테이너가 접근할 수 없는 장치이다.
  # 실제 서비스될 환경에서 지연 시간을 측정하라. 단계 13에서 기록된 실수는 GGUF 모델과 PyTorch 모델을 비교하면서 갭을 품질로 해석한 것이다.
  # VM의 CPU 할당량을 늘리면 도움이 되지만, 이 갭을 완전히 메우지는 못한다.
  reranker:
    build: ./docker/reranker
    environment:
      MODEL_ID: BAAI/bge-reranker-v2-m3
    ports:
      - "127.0.0.1:8080:8080"
# 호스트의 Hugging Face 캐시로, 가중치가 이미지에 포함되지 않고 다시 다운로드되지 않도록 함
# 읽기 전용: 컨테이너는 이 파일들을 절대 쓰지 않음
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/hf:ro

# API는 일반적으로 호스트에서 실행되므로, 호스트의 Ollama에 localhost로 접근합니다.
# 이후 컨테이너화하려면 지속 가능한 다수 GB 크기의 모델 볼륨과 다운로드 단계가 필요합니다.
# ollama:
#   image: ollama/ollama:latest
#   volumes:
#     - ollama-data:/root/.ollama

volumes:
  opensearch-data:
  # ollama-data:
